[package]
name = "minisamp-client"
version = "0.1.0"
edition = "2021"
description = "mini-samp game client, loaded into gta_sa.exe 1.0 US as minisamp.asi"

[lib]
name = "minisamp"
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../shared" }
sa-sdk = { git = "https://github.com/dntAtMe/sa-mcp" }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
